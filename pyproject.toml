[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "repopilot-ai-engineering"
version = "0.1.0"
description = "Repository-aware PR review and test proposal toolkit with optional LLM assistance"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
rag = ["faiss-cpu>=1.7.4", "sentence-transformers>=2.6"]
test = ["pytest>=7.4"]
[project.scripts]
repopilot = "repopilot.cli:main"
[tool.setuptools.packages.find]
include = ["repopilot*"]
